<!doctype html><html><head><meta charset="utf-8"><title>Hearth (local)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:system-ui,sans-serif;background:#f6efe6;color:#3a2a20;max-width:640px;margin:40px auto;padding:0 16px}
h1{font-family:Georgia,serif;font-size:3rem;margin:0}.voices{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.voices button{padding:8px 14px;border-radius:10px;border:1px solid #cbb;background:#fff;cursor:pointer}
.voices button.on{border-color:#c2410c;box-shadow:0 0 0 1px #c2410c}
#call{padding:12px 24px;border:0;border-radius:999px;background:#c2410c;color:#fff;font-weight:600;cursor:pointer}
#log p{margin:6px 0}.you{text-align:right;background:#eadfd2;padding:6px 10px;border-radius:10px}#status{color:#7a6658}
select{padding:6px 10px;border-radius:8px;border:1px solid #cbb;margin-left:6px}

.status-bar{display:flex;align-items:center;gap:12px;margin:16px 0 20px 0}
.orb{width:18px;height:18px;border-radius:50%;background:#d4c5b9;transition:all 0.3s ease;flex-shrink:0}
.orb.live,.orb.listening{background:#10b981;box-shadow:0 0 10px #10b981,0 0 20px rgba(16,185,129,0.35);animation:pulse-ring 1.8s infinite ease-in-out}
.orb.thinking{background:#8b5cf6;box-shadow:0 0 10px #8b5cf6,0 0 20px rgba(139,92,246,0.35);animation:pulse-ring 1.1s infinite ease-in-out}
.orb.speaking{background:#ea580c;box-shadow:0 0 12px #ea580c,0 0 24px rgba(234,88,12,0.45);animation:pulse-ring 0.9s infinite ease-in-out}
.orb.error{background:#ef4444;box-shadow:0 0 10px #ef4444}
@keyframes pulse-ring{0%{transform:scale(0.92);opacity:0.85}50%{transform:scale(1.15);opacity:1}100%{transform:scale(0.92);opacity:0.85}}
</style></head><body>
<h1>Hearth</h1>
<div class="status-bar">
  <div id="orb" class="orb"></div>
  <p id="status" style="margin:0">Pick a voice and press call.</p>
</div>
<label>Provider <select id="provider"></select></label>
<div class="voices" id="voices"></div><button id="call">Call</button><div id="log"></div>
<audio id="audio" autoplay></audio>
<script type="module" src="app.js"></script></body></html>
