<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Prevents Gadget UI frames from navigating away from their srcdoc while allowing YouTube embeds. -->
    <meta http-equiv="Content-Security-Policy" content="frame-src srcdoc: https://www.youtube-nocookie.com https://www.youtube.com https://*.youtube.com;">
    <!-- Prevent browsers from serving a stale version of this shell after a deploy. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Voltrix</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
